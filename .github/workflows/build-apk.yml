name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # PERMANENT AYANA SIGNING KEY
      # ==========================================

      - name: Restore AYANA signing key
        shell: bash
        env:
          AYANA_KEYSTORE_BASE64: ${{ secrets.AYANA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$AYANA_KEYSTORE_BASE64" \
            | base64 --decode \
            > app/ayana-release.jks

          echo "AYANA signing key restored"

          ls -lh app/ayana-release.jks


      # ==========================================
      # SHERPA-ONNX ANDROID LIBRARY
      # ==========================================

      - name: Download sherpa-onnx Android library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/libs

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar" \
            -o app/libs/sherpa-onnx-1.13.5.aar

          echo "6419cd8bc983e0c4fab06067f0fe0313fdc0f7103818ac1e7a08d50787b7a82b  app/libs/sherpa-onnx-1.13.5.aar" \
            | sha256sum -c -

          echo "Sherpa ONNX library downloaded successfully"

          ls -lh app/libs/


      # ==========================================
      # RUSSIAN LOCAL SPEECH MODEL
      # ==========================================

      - name: Download AYANA Russian speech model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="app/src/main/assets/sherpa_ru"

          MODEL_URL="https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-small-ru-vosk-int8-2025-08-16/resolve/main"

          mkdir -p "$MODEL_DIR"

          echo "Downloading encoder..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$MODEL_URL/encoder.int8.onnx?download=true" \
            -o "$MODEL_DIR/encoder.int8.onnx"


          echo "Downloading decoder..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$MODEL_URL/decoder.onnx?download=true" \
            -o "$MODEL_DIR/decoder.onnx"


          echo "Downloading joiner..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$MODEL_URL/joiner.int8.onnx?download=true" \
            -o "$MODEL_DIR/joiner.int8.onnx"


          echo "Downloading tokens..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$MODEL_URL/tokens.txt?download=true" \
            -o "$MODEL_DIR/tokens.txt"


          echo "Downloading BPE model..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$MODEL_URL/bpe.model?download=true" \
            -o "$MODEL_DIR/bpe.model"


          echo "AYANA Russian speech model downloaded"

          ls -lh "$MODEL_DIR"


      # ==========================================
      # BUILD SIGNED APK
      # ==========================================

      - name: Build signed debug APK
        env:
          AYANA_KEYSTORE_PASSWORD: ${{ secrets.AYANA_KEYSTORE_PASSWORD }}
          AYANA_KEY_ALIAS: ${{ secrets.AYANA_KEY_ALIAS }}
          AYANA_KEY_PASSWORD: ${{ secrets.AYANA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug --stacktrace


      # ==========================================
      # REMOVE PRIVATE KEY FROM RUNNER
      # ==========================================

      - name: Remove signing key
        if: always()
        shell: bash
        run: |
          rm -f app/ayana-release.jks


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYANA-AI-signed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
